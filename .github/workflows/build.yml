name: Build APK

on:
  push:
    branches: [ main, agent-fs, request-control-panel, fix/provider-tool-call-compat, agent-fs-reliable-file-reading, build-c-history-md, build-d-history-sidecar, feature/history-branches ]
  pull_request:
    branches: [ main, agent-fs, request-control-panel, build-c-history-md ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release APKs (CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: miniichat-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # GitHub Release: only attach release APKs (v7 + v8 split), no debug.
      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
