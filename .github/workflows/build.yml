name: Build APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, agent-fs, request-control-panel, fix/provider-tool-call-compat, agent-fs-reliable-file-reading, build-c-history-md, build-d-history-sidecar, history-session-branch-regenerate, build-d-phase-7-file-access ]
  pull_request:
    branches: [ main, agent-fs, request-control-panel, build-c-history-md ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Generate ephemeral CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/app/ci-release.keystore" \
            -storepass "fpilot-ci-only" \
            -keypass "fpilot-ci-only" \
            -alias "fpilot-ci" \
            -dname "CN=FPilot CI,O=FPilot,C=US" \
            -keyalg RSA -keysize 2048 -validity 2
          echo "RELEASE_STORE_FILE=ci-release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=fpilot-ci-only" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=fpilot-ci" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=fpilot-ci-only" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release APKs (CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: miniichat-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # GitHub Release: only attach release APKs (v7 + v8 split), no debug.
      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
